name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-check:
    name: 离线检查（单测 / 编译 / 收集基线）
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: Security audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --desc

      - name: 单元测试（离线，无后端）
        if: matrix.python-version != '3.11'
        run: python -m pytest tests/ -q

      - name: 单元测试（含覆盖率，仅 3.11）
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/ -q --cov=common --cov-report=term-missing --cov-report=html --cov-fail-under=90

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

      - name: 语法编译检查
        run: python -m compileall -q common case caseOversea caseSlp caseStarify caseGames caseLuckyPlay tests probabilityTest Robot.py run_all_case.py run_crontab_case.py auto_git_pull.py test_concurrent.py check_collect.py

      - name: 代码风格检查（ruff）
        run: ruff check .

      - name: 类型检查（mypy）
        run: mypy common tests --ignore-missing-imports

      - name: 用例收集基线校验
        run: python check_collect.py

      # 失败时输出详细诊断信息，便于在网页日志直接定位
      - name: 收集诊断（仅失败时）
        if: failure()
        run: |
          Write-Host "=== Installed Packages ==="
          pip list
          Write-Host "=== Test Verbose Output ==="
          python -m pytest tests/ -v --tb=long 2>&1 | Out-File -FilePath test_output.txt -Encoding utf8
          Get-Content test_output.txt -Tail 120
        continue-on-error: true
