# App Store 日报云端定时推送（GitHub Actions，机器关机不影响）
# GitHub schedule 为尽力而为（可能延迟甚至丢弃，:00/:30 整点分钟最易被延迟）：
# 触发点全部避开整点分钟，北京时间 10:37 起每 30 分钟重试至 15:07（可容忍
# 数小时延迟）；check job 发现当天已有成功/进行中的运行则自动跳过，确保一天只推一次。
# 手动触发可选 force 强制重推。
name: ASC Daily Report

on:
  schedule:
    - cron: '37 2 * * *'      # 北京 10:37
    - cron: '7,37 3-6 * * *'  # 北京 11:07 - 14:37 每 30 分钟重试
    - cron: '7 7 * * *'       # 北京 15:07 兜底
  workflow_dispatch:
    inputs:
      force:
        description: '强制运行（忽略"当天已运行"检查，用于手动重推）'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: asc-daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check if already ran today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "手动强制运行，跳过检查"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cutoff=$(TZ=Asia/Shanghai date -d "today 00:00" -u +%Y-%m-%dT%H:%M:%SZ)
          echo "北京时间今天 0 点对应 UTC: $cutoff"
          runs=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/asc_daily.yml/runs?per_page=50")
          count=$(echo "$runs" | jq --arg c "$cutoff" --arg me "${{ github.run_id }}" \
            '[.workflow_runs[] | select(.id != ($me | tonumber)) | select(.created_at >= $c) | select(.conclusion == "success" or .status == "queued" or .status == "in_progress")] | length' 2>/dev/null || echo -1)
          if [ "$count" -gt 0 ]; then
            echo "今天已有 $count 条成功/进行中的运行，跳过本次"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "今天尚无成功运行，本次执行"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r daily_report/requirements-asc.txt

      - name: Write secrets to local files
        env:
          ASC_ENV: ${{ secrets.ASC_ENV_FILE }}
          ASC_P8: ${{ secrets.ASC_P8_KEY }}
        run: |
          if (-not $env:ASC_ENV -or -not $env:ASC_P8) {
            Write-Error "::error::ASC_ENV_FILE / ASC_P8_KEY secrets 未配置，请到 Settings > Secrets and variables > Actions 添加"
            exit 1
          }
          # UTF-8 无 BOM 写入（.env 含中文 App 名，避免编码乱码）
          [IO.File]::WriteAllText("$PWD/daily_report/.env", $env:ASC_ENV)
          # p8 文件名从 .env 的 PRIVATE_KEY_PATH 解析，换密钥无需改 workflow
          $p8name = [regex]::Match($env:ASC_ENV, 'PRIVATE_KEY_PATH=(\S+)').Groups[1].Value
          [IO.File]::WriteAllText("$PWD/daily_report/$p8name", $env:ASC_P8)

      - name: Run daily report
        env:
          PYTHONUTF8: '1'
        run: python daily_report/fetch_asc_daily.py
