# 临时诊断 workflow：云端跑 iOS aid 定性 + 鸿蒙 IAP 核对两个脚本，用完即删
name: Diag Apps and IAP (tmp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r daily_report/requirements-asc.txt

      - name: Write secrets to local files
        env:
          ASC_ENV: ${{ secrets.ASC_ENV_FILE }}
          ASC_P8: ${{ secrets.ASC_P8_KEY }}
          HARMONY_ENV: ${{ secrets.HARMONY_ENV_FILE }}
          HARMONY_P8: ${{ secrets.HARMONY_P8_KEY }}
        run: |
          printf '%s' "$ASC_ENV" > daily_report/.env
          p8=$(grep -oP 'PRIVATE_KEY_PATH=\S+' daily_report/.env | cut -d= -f2)
          printf '%s' "$ASC_P8" > "daily_report/$p8"
          printf '%s' "$HARMONY_ENV" > daily_report/.env.harmony
          hp8=$(grep -oP 'HARMONY_IAP_KEY_PATH=\S+' daily_report/.env.harmony | cut -d= -f2)
          printf '%s' "$HARMONY_P8" > "daily_report/$hp8"

      - name: Run iOS aid diag
        env:
          PYTHONUTF8: '1'
        run: python daily_report/_diag_apps_tmp.py

      - name: Run Harmony IAP diag
        env:
          PYTHONUTF8: '1'
        run: python daily_report/_diag_hm_iap_tmp.py
