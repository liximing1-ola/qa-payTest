name: test_asc_api
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: pip install pyjwt cryptography
      - name: Test ASC API auth from runner network
        env:
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
          ASC_ENV_FILE: ${{ secrets.ASC_ENV_FILE }}
        shell: python
        run: |
          import os, time, urllib.request, urllib.error
          import jwt
          env = {}
          for line in os.environ['ASC_ENV_FILE'].splitlines():
              line = line.strip()
              if line and not line.startswith('#') and '=' in line:
                  k, v = line.split('=', 1)
                  env[k.strip()] = v.strip()
          payload = {"iss": env['ISSUER_ID'], "exp": int(time.time()) + 1200,
                     "aud": "appstoreconnect-v1"}
          token = jwt.encode(payload, os.environ['ASC_P8_KEY'],
                             algorithm="ES256", headers={"kid": env['KEY_ID']})
          url = ("https://api.appstoreconnect.apple.com/v1/salesReports"
                 "?filter[frequency]=DAILY&filter[reportType]=SALES"
                 "&filter[reportSubType]=SUMMARY"
                 "&filter[reportDate]=2026-10-06"
                 "&filter[vendorNumber]=" + env['VENDOR_NUMBER'])
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("STATUS", resp.status)
          except urllib.error.HTTPError as e:
              print("STATUS", e.code, e.read(300).decode())
              raise SystemExit(3)
